<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="I build systems that learn. Every dataset is a story, every model a question answered.">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#273040"/>
    </pattern>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="500" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 50px; fill: #f0f6fc; font-weight: 300; letter-spacing: -0.5px; }
      .b { font-weight: 800; }
      .acc { fill: #58a6ff; }
      .rise { opacity: 0; transform: translateY(18px); animation: rise 0.9s cubic-bezier(.2,.8,.2,1) forwards; }
      .d1 { animation-delay: 0.3s; }
      .d2 { animation-delay: 0.8s; }
      .d3 { animation-delay: 1.3s; }
      .d4 { animation-delay: 2.1s; }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      .q { fill: #58a6ff; opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 0.7s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
      .ul { stroke: url(#line); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.2s ease-out 1.9s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .orb { animation: float 7s ease-in-out infinite alternate; }
      .orb2 { animation: float 9s ease-in-out -4s infinite alternate-reverse; }
      @keyframes float { from { transform: translate(0,0); } to { transform: translate(34px,-26px); } }
      .spark { fill: #58a6ff; animation: twinkle 2.6s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }
      .cap { font-family: ui-monospace, Consolas, 'Courier New', monospace; font-size: 18px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#0d1117"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <circle class="orb" cx="990" cy="110" r="190" fill="url(#glowBlue)"/>
  <circle class="orb2" cx="180" cy="360" r="150" fill="url(#glowPurple)"/>

  <circle class="spark" cx="860" cy="70" r="2.5"/>
  <circle class="spark" cx="1040" cy="210" r="2" style="animation-delay:-0.8s"/>
  <circle class="spark" cx="930" cy="300" r="2.5" style="animation-delay:-1.6s"/>
  <circle class="spark" cx="1120" cy="120" r="2" style="animation-delay:-2.2s"/>
  <circle class="spark" cx="760" cy="360" r="2" style="animation-delay:-1.1s"/>

  <text class="q" x="68" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="900">“</text>

  <text class="t rise d1" x="80" y="200">I build systems that <tspan class="b acc">learn</tspan>,</text>
  <text class="t rise d2" x="80" y="260">every dataset is a story,</text>
  <text class="t rise d3" x="80" y="320">every model a question answered.</text>

  <line class="ul" x1="80" y1="352" x2="500" y2="352"/>
  <text class="cap rise d4" x="80" y="394">— Rishika Singh  ·  Machine Learning &amp; Generative AI</text>
</svg>
