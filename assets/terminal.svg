<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" role="img" aria-label="Terminal introducing Rishika Singh">
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 17px; }
      .p { fill: #3fb950; }
      .c { fill: #f0f6fc; }
      .o { fill: #8b949e; }
      .k { fill: #58a6ff; }
      .y { fill: #d29922; }
      .m { fill: #a371f7; }
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
    </style>
    <clipPath id="t1"><rect x="0" y="0" width="0" height="372"><animate attributeName="width" from="0" to="900" dur="0.7s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="0" width="0" height="372"><animate attributeName="width" from="0" to="900" dur="0.7s" begin="2.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="0" y="0" width="0" height="372"><animate attributeName="width" from="0" to="900" dur="0.9s" begin="3.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="0" y="0" width="0" height="372"><animate attributeName="width" from="0" to="900" dur="0.7s" begin="5.3s" fill="freeze"/></rect></clipPath>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="900" height="372" fill="none"/>

  <!-- window -->
  <rect x="10" y="10" width="880" height="352" rx="14" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="10" y="10" width="880" height="40" rx="14" fill="#1c2129"/>
  <rect x="10" y="36" width="880" height="14" fill="#1c2129"/>
  <line x1="10" y1="50" x2="890" y2="50" stroke="#30363d"/>
  <circle cx="34" cy="30" r="6.5" fill="#ff5f57"/>
  <circle cx="56" cy="30" r="6.5" fill="#febc2e"/>
  <circle cx="78" cy="30" r="6.5" fill="#28c840"/>
  <text class="title" x="450" y="34" text-anchor="middle">rishika@thapar: ~ — zsh</text>

  <!-- line 1 -->
  <g clip-path="url(#t1)">
    <text class="mono" x="32" y="86"><tspan class="p">rishika@thapar</tspan><tspan class="o"> ~ $ </tspan><tspan class="c">whoami</tspan></text>
  </g>
  <text class="mono" x="32" y="114" opacity="0">
    <tspan class="k">Rishika Singh</tspan><tspan class="o">  ·  FDE Intern @ Pineyard AI  ·  ECE @ Thapar University</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- line 2 -->
  <g clip-path="url(#t2)">
    <text class="mono" x="32" y="150"><tspan class="p">rishika@thapar</tspan><tspan class="o"> ~ $ </tspan><tspan class="c">cat focus.txt</tspan></text>
  </g>
  <text class="mono" x="32" y="178" opacity="0">
    <tspan class="m">voice-agents</tspan><tspan class="o">  ·  </tspan><tspan class="m">generative-ai</tspan><tspan class="o">  ·  </tspan><tspan class="m">rag</tspan><tspan class="o">  ·  </tspan><tspan class="m">computer-vision</tspan><tspan class="o">  ·  </tspan><tspan class="m">backend-systems</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.9s" fill="freeze"/>
  </text>

  <!-- line 3 -->
  <g clip-path="url(#t3)">
    <text class="mono" x="32" y="214"><tspan class="p">rishika@thapar</tspan><tspan class="o"> ~ $ </tspan><tspan class="c">ls ~/currently-learning/</tspan></text>
  </g>
  <text class="mono" x="32" y="242" opacity="0">
    <tspan class="k">rag-pipelines/</tspan><tspan class="o">   </tspan><tspan class="k">mlops/</tspan><tspan class="o">   </tspan><tspan class="k">system-design/</tspan><tspan class="o">   </tspan><tspan class="k">cloud-deployment/</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.6s" fill="freeze"/>
  </text>

  <!-- line 4 -->
  <g clip-path="url(#t4)">
    <text class="mono" x="32" y="278"><tspan class="p">rishika@thapar</tspan><tspan class="o"> ~ $ </tspan><tspan class="c">echo $MOTTO</tspan></text>
  </g>
  <text class="mono" x="32" y="306" opacity="0">
    <tspan class="y">"Turn models into products, not just notebooks."</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="6.1s" fill="freeze"/>
  </text>

  <!-- prompt + blinking cursor -->
  <text class="mono" x="32" y="342" opacity="0">
    <tspan class="p">rishika@thapar</tspan><tspan class="o"> ~ $ </tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="6.6s" fill="freeze"/>
  </text>
  <rect x="226" y="328" width="10" height="18" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="1;0" dur="1s" begin="6.6s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
</svg>
